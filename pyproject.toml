[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mms-tv-optimizer"
version = "0.1.0"
description = "MMS October 2026 MBC TV plan optimizer (Nielsen KSA eTAM)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "openpyxl>=3.1", "scipy>=1.12",
  "ortools>=9.10", "rapidfuzz>=3.6", "pyyaml>=6", "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "audit"]
addopts = "-q"
